# Render Blueprint for the Axolot API.
#
# Bug 1 fix: Render's filesystem is ephemeral, so a Chromium installed locally
# (or on a previous deploy) is GONE on every new deploy. The buildCommand below
# reinstalls Chromium fresh on each build so Playwright's headless browser is
# always present at runtime. `--with-deps` pulls the OS shared libraries Chromium
# needs on Render's build image. PLAYWRIGHT_BROWSERS_PATH (below) pins the
# install to a project-relative dir so the build's browser is found at runtime
# instead of a transient ~/.cache that may not carry over.
#
# !! IMPORTANT !! If this service is NOT blueprint-managed (i.e. it predates
# render.yaml), this buildCommand is IGNORED — set it manually in the dashboard:
#   Settings -> Build Command:
#     pip install -r requirements.txt && python -m playwright install chromium --with-deps
# Until that runs, the web agent has no browser; it falls back to httpx
# (DuckDuckGo Lite + Instant-Answer API) and then SerpAPI if SERPAPI_KEY is set.
# From datacenter IPs DuckDuckGo often times out, so SERPAPI_KEY is the reliable
# cloud path — set it in the dashboard (free tier covers light use).
#
# Secrets (GEMINI_API_KEY, GOOGLE_CLIENT_ID/SECRET, SECRET_KEY, ENCRYPTION_KEY,
# DATABASE_URL, SERPAPI_KEY, ...) are managed in the Render dashboard, not here.
services:
  - type: web
    name: axolot-api
    runtime: python
    rootDir: backend
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt && python -m playwright install chromium --with-deps"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Install Chromium into a project-relative dir (shared by build + runtime)
      # so it persists from the build step to the running service.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/project/.playwright"
      # Optional cloud-safe search fallback used when Playwright AND the httpx
      # DuckDuckGo path both fail (server IPs often get blocked). Set in the
      # dashboard; the code skips it silently when unset.
      - key: SERPAPI_KEY
        sync: false
